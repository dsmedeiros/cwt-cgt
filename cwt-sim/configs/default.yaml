# Default configuration for the placeholder simulation tooling.
graph:
  kind: ring3
  weights: 1.0
  delays: 1.0
params:
  knobs: [rho, tau]
  rho_center: 0.5
  rho_extent: 0.25
  tau_center: 0.4
  tau_extent: 0.15
  steps: 12
geometry:
  delta_frac:
    rho: 0.2
    tau: 0.2
  s_min: 0.6
  smooth_window: 5
  compute_metric: true
  compute_curvature: true
  adapt_levels: 2
  ci_tol: 0.05
dynamics:
  eta_q: 0.3
  zeta: 0.2
  omega_scale: 1.0
geometric_coupling:
  alpha: 0.2
  beta: 1.0
  xi_kind:
    type: static
  # false = distribute rectangle loop area evenly across steps (smoother updates)
  # true  = legacy corner-area impulses (explicit opt-in for backward compatibility)
  corner_area_mode: false
readout:
  type: stochastic
  T: 1.0
  memory_form: current_coupled
  params: {}
noise:
  phase_std: 0.0
  amp_noise: 0.0
  delay_std: 0.0
seed: 1234
out_dir: runs/
