# Armature CI Pipeline Configuration
# Read by .armature/hooks/run-ci.sh on the Stop event.
#
# Schema:
#   <step>:
#     command: "<shell command>"      # null/missing to skip the step
#     timeout_seconds: <int>          # optional; defaults vary per step
#
# Execution order: invariants -> test -> types -> lint
# Advisory mode by default (exit 0 even on failure).
# ARMATURE_CI_BLOCK=1 env shifts to fail-closed (exit 2 on any failure).
#
# Notes:
#   - Commands run with cwd=repo_root via bash -c.
#   - Framework tests (.armature/tests) are required; project tests run via
#     `npm test` (jest + vitest delegated through workspace scripts).
#   - Type and lint steps are scoped to staged code paths to keep the Stop
#     hook responsive; tighten coverage in CI workflows rather than here.

invariants:
  command: "bash .armature/hooks/post-stop.sh"
  timeout_seconds: 120

test:
  # Framework hook test suite + project Jest suite. The cwt_lab vitest run is
  # invoked via npm's test:lab script, so this single command exercises both.
  command: "python -m pytest .armature/tests/ -q && npm test --silent"
  timeout_seconds: 900

types:
  # TypeScript build across root + cwt_lab projects.
  command: "npm --prefix cwt_lab run typecheck"
  timeout_seconds: 300

lint:
  # ESLint over the desktop lab + renderer surface. Python lint (ruff) is
  # intentionally omitted here because cwt-sim hasn't been linted clean
  # against the configured rule set; add once the baseline is fixed.
  command: "npm --prefix cwt_lab run lint"
  timeout_seconds: 300
