# Armature Invariant Registry
# Each invariant maps to a defining ADR and enforcement mechanism.

invariants:
  # === Armature Governance ===
  SPEC-001:
    name: "Specification internal consistency"
    severity: critical
    description: "ARMATURE.md section numbering, cross-references, and schema definitions must all agree internally."
    rule: "ARMATURE.md must be internally consistent — no broken cross-references or contradictory schema definitions."
    defined-in: .armature/ARMATURE.md
    enforced-by:
      ci:
        - .armature/hooks/post-stop.sh
    referenced-in:
      - .armature/agents.md
    status: active
    exceptions: []
    planned-enforcement: []
    superseded-by: null

  SPEC-002:
    name: "Framework-generic file integrity"
    severity: high
    description: "Framework-generic files must match the canonical Armature repo and not be locally modified without backport."
    rule: "Framework-generic files (personas, templates, hooks, commands) must stay in sync with the canonical Armature repository."
    defined-in: .armature/ARMATURE.md
    enforced-by:
      ci:
        - .armature/hooks/post-stop.sh
    referenced-in:
      - .armature/agents.md
      - .claude/agents/agents.md
      - .claude/commands/agents.md
    status: active
    exceptions: []
    planned-enforcement: []
    superseded-by: null

  SCHEMA-001:
    name: "Config.yaml schema compliance"
    severity: high
    description: "config.yaml must contain all required fields defined by the ARMATURE.md specification."
    rule: "config.yaml must conform to the schema defined in ARMATURE.md — all required fields present with correct types."
    defined-in: .armature/ARMATURE.md
    enforced-by:
      ci:
        - .armature/hooks/post-stop.sh
    referenced-in:
      - .armature/agents.md
    status: active
    exceptions: []
    planned-enforcement: []
    superseded-by: null

  SCHEMA-002:
    name: "Registry.yaml schema compliance"
    severity: high
    description: "registry.yaml entries must conform to the registry entry schema defined in ARMATURE.md."
    rule: "Every registry entry must have id, name, severity, description, rule, defined-in, enforced-by, referenced-in, and status fields."
    defined-in: .armature/ARMATURE.md
    enforced-by:
      ci:
        - .armature/hooks/post-stop.sh
    referenced-in:
      - .armature/agents.md
    status: active
    exceptions: []
    planned-enforcement: []
    superseded-by: null

  ADAPTER-001:
    name: Tool adapter consistency
    severity: high
    description: Tool-specific adapter files must route to the shared governance sources and must not redefine or contradict them.
    rule: "Tool-specific adapter files must route to the same governance sources and must not redefine or contradict root/scoped governance, ADRs, or the invariant registry."
    status: active
    superseded-by: null
    defined-in: docs/adr/0002-tool-adapters-and-codex-support.md
    enforced-by:
      ci: []
    referenced-in:
      - .armature/agents.md
      - .claude/agents/agents.md
    exceptions: []

  CI-001:
    name: CI pipeline gate
    severity: high
    description: "Full CI pipeline (tests, types, lint, invariants) must run on Stop when code is dirty to prevent ungated code from closing a session."
    rule: Full CI pipeline (tests + types + lint + invariants) must run on Stop when code is dirty.
    status: active
    superseded-by: null
    defined-in: .armature/ARMATURE.md
    enforced-by:
      ci: []
      hooks:
        - .armature/hooks/run-ci.sh
      startup: []
      runtime: []
    planned-enforcement: []
    referenced-in:
      - .armature/agents.md
    exceptions: []

  DISCIPLINE-001:
    name: Discipline tag definition
    severity: standard
    description: Persona discipline tags declared in agents.md frontmatter must be defined in the standards corpus to prevent references to undefined disciplines.
    rule: Persona discipline tags declared in agents.md frontmatter must be defined in the standards corpus.
    status: active
    superseded-by: null
    defined-in: .armature/ARMATURE.md
    enforced-by:
      ci: []
      hooks: []
      startup: []
      runtime: []
    planned-enforcement: []
    referenced-in:
      - .armature/agents.md
    exceptions: []

  HOOK-001:
    name: Destructive command prevention
    severity: high
    description: "Destructive shell commands (rm -rf, force push, hard reset, DROP TABLE, --no-verify) must be blocked to prevent irreversible damage."
    rule: The block-dangerous-commands.sh hook must block destructive shell commands on PreToolUse(Bash) events.
    status: active
    superseded-by: null
    defined-in: docs/adr/0001-governance-as-files.md
    enforced-by:
      hooks:
        - .armature/hooks/block-dangerous-commands.sh
    referenced-in:
      - .armature/agents.md
    exceptions: []

  HOOK-002:
    name: Agent self-governance prevention
    severity: critical
    description: Agents must not modify their own governance configuration to prevent self-modification undermining enforcement.
    rule: The block-config-changes.sh hook must block agent-initiated configuration changes on ConfigChange events.
    status: active
    superseded-by: null
    defined-in: docs/adr/0001-governance-as-files.md
    enforced-by:
      hooks:
        - .armature/hooks/block-config-changes.sh
    referenced-in:
      - .armature/agents.md
    exceptions: []

  HOOK-003:
    name: Application code change tracking
    severity: standard
    description: Application code changes must be tracked to enable conditional test verification on session stop.
    rule: The mark-dirty.sh hook must create a dirty marker when non-governance files are modified.
    status: active
    superseded-by: null
    defined-in: docs/adr/0001-governance-as-files.md
    enforced-by:
      hooks:
        - .armature/hooks/mark-dirty.sh
        - .armature/hooks/post-stop.sh
    referenced-in:
      - .armature/agents.md
    exceptions: []

  HOOK-004:
    name: Subagent governance context injection
    severity: high
    description: "Subagents must receive governance context (active invariants, session state, scope directives) at spawn time."
    rule: The inject-context.sh hook must inject governance context into subagent system prompts on SubagentStart events.
    status: active
    superseded-by: null
    defined-in: docs/adr/0001-governance-as-files.md
    enforced-by:
      hooks:
        - .armature/hooks/inject-context.sh
    referenced-in:
      - .armature/agents.md
    exceptions: []

  HOOK-005:
    name: Post-compaction context recovery
    severity: high
    description: Session state must be mechanically re-injected after context compaction to prevent governance amnesia.
    rule: The reinject-context.sh hook must restore session state on SessionStart(compact) events.
    status: active
    superseded-by: null
    defined-in: docs/adr/0001-governance-as-files.md
    enforced-by:
      hooks:
        - .armature/hooks/reinject-context.sh
    referenced-in:
      - .armature/agents.md
    exceptions: []

  HOOK-006:
    name: Required reading advisory
    severity: standard
    description: Agents editing governed files should be advised of required reading (governing agents.md and referenced ADRs).
    rule: "The check-required-reading.sh hook must advise agents of required reading on PreToolUse(Edit|Write) events."
    status: active
    superseded-by: null
