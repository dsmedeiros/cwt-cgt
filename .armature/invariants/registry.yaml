    enforced-by:
      hooks:
        - .armature/hooks/check-required-reading.sh
    referenced-in:
      - .armature/agents.md
    exceptions: []

  HOTFIX-001:
    name: Hotfix audit trail
    severity: high
    description: Hotfix bypass must produce an audit record and block subsequent normal-phase work until postmortem lands.
    rule: Hotfix bypass must produce an audit record and block subsequent normal-phase work until postmortem lands.
