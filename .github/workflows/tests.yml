name: CI

on:
  push:
    branches: ["main", "master", "work"]
    paths:
      - "cwt-sim/**"
      - ".github/workflows/tests.yml"
      - "requirements.test.txt"
      - "requirements.txt"
  pull_request:
    paths:
      - "cwt-sim/**"
      - ".github/workflows/tests.yml"
      - "requirements.test.txt"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  hygiene:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt

      - name: Pytest (unit)
        working-directory: cwt-sim
        run: pytest -m unit -q

      - name: Pytest (regression)
        working-directory: cwt-sim
        run: pytest -m regression -q

      - name: Mypy type checking
        working-directory: cwt-sim
        run: mypy

      - name: Ruff lint
        working-directory: cwt-sim
        continue-on-error: true
        run: ruff check .

      - name: Black formatting
        working-directory: cwt-sim
        continue-on-error: true
        run: black --check .

  generator-response-python313:
    name: Generator response protocol (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Verify exact Python runtime
        run: >-
          python -I -B -c
          "import sys; assert sys.version_info[:2] == (3, 13), sys.version"

      - name: Materialize locked adapter source snapshot
        run: |
          git clone --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/generator-response-source"
          git -C "$RUNNER_TEMP/generator-response-source" checkout --detach 91ac93316c34a533b72ae37d5e226f9ac7e090b6
          test "$(git -C "$RUNNER_TEMP/generator-response-source" rev-parse HEAD)" = "91ac93316c34a533b72ae37d5e226f9ac7e090b6"
          test "$(git -C "$RUNNER_TEMP/generator-response-source" rev-parse 'HEAD^{tree}')" = "7fd2ce1140d062d2bef3f2adf7cfc6e06aeeccba"
          python -I -B -c "import hashlib,subprocess,sys; raw=subprocess.check_output(['git','--no-replace-objects','-C',sys.argv[1],'cat-file','blob','HEAD:requirements.test.txt']); assert hashlib.sha256(raw).hexdigest() == '11cc1302a3896ed8af355bcfad65bc7aeec70ceeac2cec2c3a70ea456c507539'" "$RUNNER_TEMP/generator-response-source"

      - name: Install locked dependencies
        run: python -m pip install -r "$RUNNER_TEMP/generator-response-source/requirements.test.txt"

      - name: Pytest generator response protocol
        working-directory: ${{ runner.temp }}/generator-response-source/cwt-sim
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -B -m pytest -p no:cacheprovider -q
          --junitxml="$RUNNER_TEMP/generator-response-python313.xml"
          tests/experiments/test_generator_tensor_response_protocol.py

      - name: Verify exact focused-suite result
        run: |
          python -I -B - "$RUNNER_TEMP/generator-response-python313.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          def local_name(element):
              return element.tag.rsplit("}", 1)[-1]

          root = ET.parse(sys.argv[1]).getroot()
          cases = [element for element in root.iter() if local_name(element) == "testcase"]
          failures = [
              case
              for case in cases
              if any(local_name(child) == "failure" for child in case)
          ]
          errors = [
              case
              for case in cases
              if any(local_name(child) == "error" for child in case)
          ]
          skipped = [
              case
              for case in cases
              if any(local_name(child) == "skipped" for child in case)
          ]
          skipped_names = [case.attrib.get("name") for case in skipped]
          expected_skip = ["test_closed_structure_inventory_is_python_minor_neutral"]
          if (
              len(cases) != 101
              or failures
              or errors
              or len(skipped) != 1
              or skipped_names != expected_skip
          ):
              raise SystemExit(
                  "focused-suite result refused: "
                  f"tests={len(cases)} failures={len(failures)} "
                  f"errors={len(errors)} skipped={skipped_names!r}"
              )
          print("PASS tests=101 failures=0 errors=0 skipped=1")
          PY
